<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyHub — Conectando…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 380px; }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 18px;
      border: 3px solid rgba(99,102,241,.25);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h3 { margin: 0 0 8px; font-weight: 700; }
    p { color: #94a3b8; font-size: 14px; margin: 0; }
    a { color: #818cf8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h3>Conectando con StudyHub…</h3>
    <p>Si la app no se abre en unos segundos, <a href="#" id="retry">toca aquí</a>.</p>
  </div>
  <script>
    // El backend redirige a ${FRONTEND_URL}/auth/callback?token=...&user=...
    // Esta página reenvía esos parámetros a la app móvil vía deep link studyhub://
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token') || '';
      var user = params.get('user') || '';
      var retry = document.getElementById('retry');

      function go() {
        if (!token) {
          document.querySelector('.box').innerHTML =
            '<h3>No se recibió token</h3><p>Cierra esta pestaña y vuelve a la app.</p>';
          return;
        }
        var url = 'studyhub://auth/callback?token=' + encodeURIComponent(token);
        if (user) url += '&user=' + encodeURIComponent(user);
        window.location.replace(url);
      }

      retry.addEventListener('click', function (e) { e.preventDefault(); go(); });
      go();
    })();
  </script>
</body>
</html>
